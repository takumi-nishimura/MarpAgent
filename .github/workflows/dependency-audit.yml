name: Dependency Audit

on:
    pull_request:
        paths:
            - "package.json"
            - "package-lock.json"
            - ".github/dependency-audit-baseline.json"
            - ".github/workflows/dependency-audit.yml"
            - "scripts/audit-dependencies.js"
            - "src/dependency-audit.js"
            - "tests/unit/dependency-audit.test.js"
    push:
        branches: [main]
        paths:
            - "package.json"
            - "package-lock.json"
            - ".github/dependency-audit-baseline.json"
            - ".github/workflows/dependency-audit.yml"
            - "scripts/audit-dependencies.js"
            - "src/dependency-audit.js"
            - "tests/unit/dependency-audit.test.js"
    schedule:
        - cron: "0 2 * * 1"
    workflow_dispatch:

permissions:
    contents: read

# Weekly and manual audits are independent; only superseded PR/push runs cancel.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 25.6.0
                  cache: npm
            - run: npm ci --ignore-scripts --no-audit
            - run: npm run audit:dependencies
