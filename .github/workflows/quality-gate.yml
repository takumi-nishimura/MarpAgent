name: Quality Gate

on:
  pull_request:
  # Manual dispatch retains the complete strict acceptance suite.
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Keep a completed check on content-only PRs, without installing the engine.
      - name: Select engine checks
        id: changes
        shell: bash
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$CI_EVENT" == workflow_dispatch || -z "$CI_BASE" || "$CI_BASE" =~ ^0+$ ]]; then
            echo 'engine=true' >> "$GITHUB_OUTPUT"
          else
            # Fetch only missing endpoints for multi-commit pushes or older bases.
            for revision in "$CI_BASE" "$CI_HEAD"; do
              if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$revision"
              fi
            done
            if git diff --quiet "$CI_BASE" "$CI_HEAD" -- . ':!decks/**' ':!docs/**'; then
              echo 'engine=false' >> "$GITHUB_OUTPUT"
            else
              status=$?
              if [[ "$status" != 1 ]]; then exit "$status"; fi
              echo 'engine=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Report content-only validation scope
        if: steps.changes.outputs.engine == 'false'
        run: echo 'Deck/docs-only change; engine checks not selected. Run this workflow manually for full strict acceptance.' >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.changes.outputs.engine == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 25.6.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.engine == 'true'
        run: npm ci

      - name: Run lightweight engine checks
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.engine == 'true'
        run: npm run test:ci

      - name: Install Playwright browsers
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium firefox

      - name: Setup pinned uv for test font preparation
        if: github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"

      - name: Install pinned D2 acceptance tools explicitly
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/terrastruct/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/d2.tar.gz"
          printf '%s  %s\n' 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9 "$RUNNER_TEMP/d2.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf' -o "$RUNNER_TEMP/NotoSansJP-variable.ttf"
          printf '%s  %s\n' c2f3b4d463500a2ddcd3849cded1fceeb9fd6d1c32e6cbecd568453ba50fc68f "$RUNNER_TEMP/NotoSansJP-variable.ttf" | sha256sum --check
          uv run --no-project --with fonttools==4.60.1 python -m fontTools.varLib.instancer "$RUNNER_TEMP/NotoSansJP-variable.ttf" wght=400 --output "$RUNNER_TEMP/NotoSansJP-Regular.ttf"

      - name: Run fixed-version D2 acceptance
        if: github.event_name == 'workflow_dispatch'
        env:
          MARP_AGENT_D2_PATH: ${{ runner.temp }}/d2-v0.9.0/bin/d2
          MARP_AGENT_D2_FONT_PATH: ${{ runner.temp }}/NotoSansJP-Regular.ttf
          CHROME_NO_SANDBOX: "1"
        run: npm run test:d2

      - name: Verify portable D2 bundles without source or network
        if: github.event_name == 'workflow_dispatch'
        env:
          MARP_AGENT_D2_PATH: ${{ runner.temp }}/d2-v0.9.0/bin/d2
          MARP_AGENT_D2_FONT_PATH: ${{ runner.temp }}/NotoSansJP-Regular.ttf
          CHROME_NO_SANDBOX: "1"
        run: npm run test:zip:d2

      - name: Run strict quality gate
        if: github.event_name == 'workflow_dispatch'
        env:
          MARP_AGENT_D2_PATH: ${{ runner.temp }}/d2-v0.9.0/bin/d2
          MARP_AGENT_D2_FONT_PATH: ${{ runner.temp }}/NotoSansJP-Regular.ttf
          # GitHub's Ubuntu runners cannot start Chromium's sandbox for the
          # browser that Marp CLI launches for PDF/PPTX/image export, so the
          # browser exits with "Target closed". Playwright's own browsers are
          # unaffected.
          CHROME_NO_SANDBOX: "1"
        run: npm run quality:gate:strict
