name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.6.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run strict quality gate
        env:
          # GitHub's Ubuntu runners cannot start Chromium's sandbox for the
          # browser that Marp CLI launches for PDF/PPTX/image export, so the
          # browser exits with "Target closed". Playwright's own browsers are
          # unaffected.
          CHROME_NO_SANDBOX: "1"
        run: npm run quality:gate:strict
